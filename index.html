<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work Logger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f2ec;
      --card: #fdfbf7;
      --ink: #1a1612;
      --ink-soft: #6b6560;
      --ink-faint: #c8c2ba;
      --accent: #c84b31;
      --accent-bg: #fdf0ec;
      --border: #e2ddd6;
      --success: #2e7d52;
      --mono: 'DM Mono', monospace;
      --sans: 'Sora', sans-serif;
      --transition: 0.25s ease;
    }

    /* Dark Mode Overrides */
    body.dark-mode {
      --bg: #121212;
      --card: #1c1c1c;
      --ink: #e5e0d8;
      --ink-soft: #a19a93;
      --ink-faint: #3d3935;
      --accent: #ff6b4a;
      --accent-bg: #2a1a16;
      --border: #2d2a27;
      --success: #81c784;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      min-height: 100vh;
      padding: 24px 16px 60px;
      transition: background var(--transition), color var(--transition);
    }

    .page { max-width: 540px; margin: 0 auto; }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 0 28px;
      border-bottom: 2px solid var(--ink);
      margin-bottom: 28px;
    }

    .header-left h1 {
      font-family: var(--mono);
      font-size: 1.15rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .date-badge {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--ink-soft);
    }

    .theme-toggle {
      background: var(--accent-bg);
      border: 1.5px solid var(--border);
      color: var(--accent);
      padding: 8px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: var(--transition);
    }

    .theme-toggle:hover { border-color: var(--accent); }

    /* ── Cards ── */
    .card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 22px 20px;
      margin-bottom: 18px;
      transition: background var(--transition), border-color var(--transition);
    }

    .card-title {
      font-family: var(--mono);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-bottom: 18px;
    }

    /* ── Fields & Inputs ── */
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .field label { font-family: var(--mono); font-size: 0.68rem; color: var(--ink-soft); text-transform: uppercase; }

    input[type="date"], input[type="time"] {
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      color: var(--ink);
      font-family: var(--mono);
      font-size: 0.95rem;
      padding: 10px 12px;
      width: 100%;
      outline: none;
      color-scheme: inherit;
    }

    .time-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .time-wrap { display: flex; gap: 6px; align-items: center; }

    .now-btn {
      background: var(--accent-bg);
      border: 1.5px solid var(--accent);
      color: var(--accent);
      font-family: var(--mono);
      font-size: 0.6rem;
      padding: 6px 8px;
      border-radius: 6px;
      cursor: pointer;
    }

    /* ── Breaks ── */
    .break-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .add-break-btn { background: none; border: 1.5px dashed var(--ink-faint); color: var(--ink-soft); font-family: var(--mono); font-size: 0.68rem; padding: 5px 10px; border-radius: 6px; cursor: pointer; }
    .break-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .remove-btn { background: none; border: none; color: var(--ink-faint); cursor: pointer; padding: 4px; }

    /* ── Actions ── */
    .actions { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-top: 18px; }
    .save-btn { background: var(--ink); color: var(--bg); border: none; border-radius: 8px; font-family: var(--mono); font-size: 0.78rem; padding: 12px; cursor: pointer; font-weight: 500; }
    .del-btn { background: none; border: 1.5px solid var(--border); color: var(--ink-soft); border-radius: 8px; font-family: var(--mono); font-size: 0.78rem; padding: 12px 16px; cursor: pointer; }

    /* ── History ── */
    .history-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .history-date, .history-hrs { font-family: var(--mono); font-size: 0.82rem; }
    .weekly-total { display: flex; justify-content: space-between; margin-top: 14px; padding-top: 12px; border-top: 2px solid var(--ink); font-family: var(--mono); font-weight: 600; }

    /* ── Summary ── */
    .summary-box { background: var(--bg); border: 1.5px solid var(--border); border-radius: 10px; padding: 16px; margin-top: 18px; }
    .summary-text { font-family: var(--mono); font-size: 0.82rem; line-height: 1.85; white-space: pre-wrap; }
    .copy-btn { display: flex; align-items: center; gap: 6px; background: none; border: 1.5px solid var(--border); border-radius: 7px; color: var(--ink-soft); font-family: var(--mono); font-size: 0.68rem; padding: 7px 12px; cursor: pointer; margin-top: 12px; }
    .copy-btn.copied { border-color: var(--success); color: var(--success); }

    .reset-notice { font-family: var(--mono); font-size: 0.66rem; color: var(--ink-faint); text-align: center; margin-top: 10px; }
    .empty-note { font-family: var(--mono); font-size: 0.78rem; color: var(--ink-faint); text-align: center; padding: 18px 0; }
  </style>
</head>
<body>

<div class="page">
  <div class="header">
    <div class="header-left">
      <h1>Work Logger</h1>
      <span class="date-badge" id="todayDate"></span>
    </div>
    <button class="theme-toggle" onclick="toggleTheme()">
      <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>
  </div>

  <div class="card">
    <div class="card-title">Log Entry</div>
    <div class="field">
      <label>Date</label>
      <input type="date" id="datePicker">
    </div>

    <div class="time-row">
      <div class="field">
        <label>Start time</label>
        <div class="time-wrap">
          <input type="time" id="startTime">
          <button class="now-btn" onclick="setNow('startTime')">Now</button>
        </div>
      </div>
      <div class="field">
        <label>End time</label>
        <div class="time-wrap">
          <input type="time" id="endTime">
          <button class="now-btn" onclick="setNow('endTime')">Now</button>
        </div>
      </div>
    </div>

    <div class="break-header">
      <span class="break-label">Breaks</span>
      <button class="add-break-btn" onclick="addBreak()">+ Add break</button>
    </div>
    <div id="breakContainer"></div>

    <div class="actions">
      <button class="save-btn" onclick="saveData()">Save Entry</button>
      <button class="del-btn" onclick="deleteDay()">Delete</button>
    </div>

    <div class="summary-box" id="daySummaryBox" style="display:none">
      <pre class="summary-text" id="daySummaryText"></pre>
      <button class="copy-btn" id="copyBtn" onclick="copySummary()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2-2v1"/></svg>
        Copy text
      </button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">This Week <span id="weekRange" style="font-weight:300"></span></div>
    <div id="weeklyData"></div>
    <div class="reset-notice" id="resetNotice"></div>
  </div>
</div>

<script>
  // ── Helpers ──
  const toMin = t => { if (!t) return 0; const [h, m] = t.split(':').map(Number); return h * 60 + m; };
  const fmtTime = t => { if (!t) return '–'; let [h, m] = t.split(':').map(Number); const ampm = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12; return `${h}:${String(m).padStart(2,'0')} ${ampm}`; };
  const fmtDate = dateStr => new Date(dateStr + 'T00:00:00').toLocaleDateString('en-IN', { day: '2-digit', month: 'short' });
  const fmtHrMin = mins => { const h = Math.floor(mins / 60); const m = Math.round(mins % 60); return h === 0 ? `${m} min` : m === 0 ? `${h} hr` : `${h} hr ${m} min`; };

  function setNow(id) { document.getElementById(id).value = new Date().toTimeString().slice(0,5); }

  function getWeekMonday(from = new Date()) {
    const d = new Date(from); d.setHours(0,0,0,0);
    const day = d.getDay(); const diff = day === 0 ? -6 : 1 - day;
    d.setDate(d.getDate() + diff); return d;
  }

  function loadStore() {
    const raw = localStorage.getItem('workLogs_v2');
    const monKey = getWeekMonday().toISOString().slice(0,10);
    if (!raw) return { weekKey: monKey, days: {} };
    const store = JSON.parse(raw);
    return store.weekKey !== monKey ? { weekKey: monKey, days: {} } : store;
  }

  function saveStore(store) { localStorage.setItem('workLogs_v2', JSON.stringify(store)); }

  function addBreak(s = '', e = '') {
    const div = document.createElement('div'); div.className = 'break-row';
    div.innerHTML = `<input type="time" class="bStart" value="${s}"><input type="time" class="bEnd" value="${e}"><button class="remove-btn" onclick="this.parentElement.remove()">✕</button>`;
    document.getElementById('breakContainer').appendChild(div);
  }

  function calcMins(day) {
    let total = toMin(day.end) - toMin(day.start);
    if (total < 0) total += 1440;
    (day.breaks || []).forEach(b => { const diff = toMin(b.end) - toMin(b.start); if (diff > 0) total -= diff; });
    return Math.max(0, total);
  }

  function saveData() {
    const key = document.getElementById('datePicker').value;
    const start = document.getElementById('startTime').value;
    const end = document.getElementById('endTime').value;
    if (!key || !start || !end) return alert('Fill all fields');

    const breaks = [];
    document.querySelectorAll('.break-row').forEach(b => {
      const s = b.querySelector('.bStart').value; const e = b.querySelector('.bEnd').value;
      if (s && e) breaks.push({ start: s, end: e });
    });

    const store = loadStore();
    store.days[key] = { start, end, breaks };
    saveStore(store);
    loadWeekly();
    updateDaySummary();
  }

  function loadDayData() {
    const key = document.getElementById('datePicker').value;
    const day = loadStore().days[key];
    document.getElementById('startTime').value = day?.start || '';
    document.getElementById('endTime').value = day?.end || '';
    document.getElementById('breakContainer').innerHTML = '';
    (day?.breaks || []).forEach(b => addBreak(b.start, b.end));
    updateDaySummary();
  }

  function deleteDay() {
    const key = document.getElementById('datePicker').value;
    if (!confirm('Delete entry?')) return;
    const store = loadStore(); delete store.days[key];
    saveStore(store); loadDayData(); loadWeekly();
  }

  function loadWeekly() {
    const store = loadStore();
    const container = document.getElementById('weeklyData');
    container.innerHTML = '';
    const entries = Object.entries(store.days).sort((a,b) => a[0].localeCompare(b[0]));

    if (!entries.length) { container.innerHTML = '<div class="empty-note">No entries this week</div>'; return; }

    let grandMins = 0;
    entries.forEach(([date, d]) => {
      const mins = calcMins(d); grandMins += mins;
      container.innerHTML += `<div class="history-row"><span class="history-date">${fmtDate(date)}</span><span class="history-hrs">${fmtHrMin(mins)}</span></div>`;
    });

    container.innerHTML += `<div class="weekly-total"><span>Grand Total</span><span>${fmtHrMin(grandMins)}</span></div>`;
    
    const mon = getWeekMonday(); const sun = new Date(mon); sun.setDate(sun.getDate() + 6);
    document.getElementById('weekRange').textContent = `— ${fmtDate(mon.toISOString().slice(0,10))} to ${fmtDate(sun.toISOString().slice(0,10))}`;
    
    const nextMon = new Date(mon); nextMon.setDate(nextMon.getDate() + 7);
    document.getElementById('resetNotice').textContent = `Auto-resets on ${nextMon.toLocaleDateString('en-IN',{weekday:'short',day:'2-digit',month:'short'})}`;
    updateDaySummary(grandMins);
  }

  function updateDaySummary(grandMins) {
    const key = document.getElementById('datePicker').value;
    const store = loadStore(); const day = store.days[key];
    const box = document.getElementById('daySummaryBox');
    if (!day) { box.style.display = 'none'; return; }

    if (grandMins === undefined) grandMins = Object.values(store.days).reduce((s, d) => s + calcMins(d), 0);

    const breakStr = (day.breaks || []).map(b => `${fmtTime(b.start)} – ${fmtTime(b.end)}`).join(', ') || 'NIL';
    document.getElementById('daySummaryText').textContent = `${fmtDate(key)} :-\nWorking hours :- ${fmtTime(day.start)} to ${fmtTime(day.end)}\nBreak :- ${breakStr}\nTotal hours :- ${fmtHrMin(calcMins(day))}\n\nGrand Total hours :- ${fmtHrMin(grandMins)}`;
    box.style.display = 'block';
  }

  function copySummary() {
    navigator.clipboard.writeText(document.getElementById('daySummaryText').textContent).then(() => {
      const btn = document.getElementById('copyBtn');
      btn.classList.add('copied'); btn.innerHTML = `Copied!`;
      setTimeout(() => { btn.classList.remove('copied'); btn.innerHTML = `Copy text`; }, 2000);
    });
  }

  // ── Theme Logic ──
  function toggleTheme() {
    const isDark = document.body.classList.toggle('dark-mode');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    updateThemeIcon(isDark);
  }

  function updateThemeIcon(isDark) {
    const icon = document.getElementById('themeIcon');
    icon.innerHTML = isDark 
      ? `<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>`
      : `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>`;
  }

  window.onload = () => {
    if (localStorage.getItem('theme') === 'dark') { document.body.classList.add('dark-mode'); updateThemeIcon(true); }
    document.getElementById('datePicker').value = new Date().toISOString().slice(0,10);
    document.getElementById('todayDate').textContent = new Date().toLocaleDateString('en-IN',{weekday:'long', day:'numeric', month:'long', year:'numeric'});
    document.getElementById('datePicker').addEventListener('change', loadDayData);
    loadDayData(); loadWeekly();
  };
</script>
</body>
</html>
