<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work Logger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f2ec;
      --card: #fdfbf7;
      --ink: #1a1612;
      --ink-soft: #6b6560;
      --ink-faint: #c8c2ba;
      --accent: #c84b31;
      --accent-bg: #fdf0ec;
      --border: #e2ddd6;
      --success: #2e7d52;
      --mono: 'DM Mono', monospace;
      --sans: 'Sora', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      min-height: 100vh;
      padding: 24px 16px 60px;
    }

    .page {
      max-width: 540px;
      margin: 0 auto;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 20px 0 28px;
      border-bottom: 2px solid var(--ink);
      margin-bottom: 28px;
    }

    .header h1 {
      font-family: var(--mono);
      font-size: 1.15rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .header .date-badge {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--ink-soft);
      letter-spacing: 0.03em;
    }

    /* ── Cards ── */
    .card {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 22px 20px;
      margin-bottom: 18px;
    }

    .card-title {
      font-family: var(--mono);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-bottom: 18px;
    }

    /* ── Fields ── */
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    .field label {
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      color: var(--ink-soft);
      text-transform: uppercase;
    }

    input[type="date"],
    input[type="time"] {
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      color: var(--ink);
      font-family: var(--mono);
      font-size: 0.95rem;
      padding: 10px 12px;
      width: 100%;
      outline: none;
      transition: border-color 0.15s;
      -webkit-appearance: none;
      appearance: none;
      color-scheme: light;
    }

    input[type="date"]:focus,
    input[type="time"]:focus {
      border-color: var(--accent);
    }

    /* ── Time Row ── */
    .time-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    .time-wrap {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .time-wrap input { flex: 1; }

    .now-btn {
      background: var(--accent-bg);
      border: 1.5px solid var(--accent);
      color: var(--accent);
      font-family: var(--mono);
      font-size: 0.6rem;
      letter-spacing: 0.05em;
      padding: 6px 8px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      font-weight: 500;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .now-btn:hover { background: var(--accent); color: white; }

    /* ── Breaks ── */
    .break-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .break-label {
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      color: var(--ink-soft);
      text-transform: uppercase;
    }

    .add-break-btn {
      background: none;
      border: 1.5px dashed var(--ink-faint);
      color: var(--ink-soft);
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .add-break-btn:hover { border-color: var(--accent); color: var(--accent); }

    .break-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }
    .break-row input { flex: 1; }

    .remove-btn {
      background: none;
      border: none;
      color: var(--ink-faint);
      font-size: 16px;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
      transition: color 0.15s;
      flex-shrink: 0;
    }
    .remove-btn:hover { color: var(--accent); }

    /* ── Actions ── */
    .actions {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-top: 18px;
    }

    .save-btn {
      background: var(--ink);
      color: var(--bg);
      border: none;
      border-radius: 8px;
      font-family: var(--mono);
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 12px;
      cursor: pointer;
      transition: opacity 0.15s;
      font-weight: 500;
    }
    .save-btn:hover { opacity: 0.8; }

    .del-btn {
      background: none;
      border: 1.5px solid var(--border);
      color: var(--ink-soft);
      border-radius: 8px;
      font-family: var(--mono);
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      padding: 12px 16px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .del-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── History List ── */
    .history-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .history-row:last-of-type { border-bottom: none; }

    .history-date {
      font-family: var(--mono);
      font-size: 0.82rem;
      color: var(--ink);
    }

    .history-hrs {
      font-family: var(--mono);
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--ink);
    }

    .weekly-total {
      display: flex;
      justify-content: space-between;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 2px solid var(--ink);
    }

    .weekly-total span {
      font-family: var(--mono);
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.04em;
    }

    /* ── Summary Box ── */
    .summary-box {
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-top: 18px;
    }

    .summary-text {
      font-family: var(--mono);
      font-size: 0.82rem;
      line-height: 1.85;
      color: var(--ink);
      white-space: pre-wrap;
      word-break: break-word;
    }

    .copy-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: 1.5px solid var(--border);
      border-radius: 7px;
      color: var(--ink-soft);
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 7px 12px;
      cursor: pointer;
      margin-top: 12px;
      transition: all 0.15s;
    }
    .copy-btn:hover { border-color: var(--success); color: var(--success); }
    .copy-btn.copied { border-color: var(--success); color: var(--success); }

    /* ── Reset notice ── */
    .reset-notice {
      font-family: var(--mono);
      font-size: 0.66rem;
      color: var(--ink-faint);
      text-align: center;
      margin-top: 10px;
      letter-spacing: 0.04em;
    }

    .empty-note {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--ink-faint);
      text-align: center;
      padding: 18px 0;
    }
  </style>
</head>
<body>

<div class="page">

  <div class="header">
    <h1>Work Logger</h1>
    <span class="date-badge" id="todayDate"></span>
  </div>

  <!-- LOG CARD -->
  <div class="card">
    <div class="card-title">Log Entry</div>

    <div class="field">
      <label>Date</label>
      <input type="date" id="datePicker">
    </div>

    <div class="time-row">
      <div class="field" style="margin-bottom:0">
        <label>Start time</label>
        <div class="time-wrap">
          <input type="time" id="startTime">
          <button class="now-btn" onclick="setNow('startTime')">Now</button>
        </div>
      </div>
      <div class="field" style="margin-bottom:0">
        <label>End time</label>
        <div class="time-wrap">
          <input type="time" id="endTime">
          <button class="now-btn" onclick="setNow('endTime')">Now</button>
        </div>
      </div>
    </div>

    <div class="break-header" style="margin-top:14px">
      <span class="break-label">Breaks</span>
      <button class="add-break-btn" onclick="addBreak()">+ Add break</button>
    </div>

    <div id="breakContainer"></div>

    <div class="actions">
      <button class="save-btn" onclick="saveData()">Save Entry</button>
      <button class="del-btn" onclick="deleteDay()">Delete</button>
    </div>
  </div>

  <!-- WEEKLY CARD -->
  <div class="card">
    <div class="card-title">This Week <span id="weekRange" style="font-weight:300; letter-spacing:0.02em"></span></div>
    <div id="weeklyData"></div>

    <!-- SUMMARY -->
    <div class="summary-box" id="summaryBox" style="display:none">
      <pre class="summary-text" id="summaryText"></pre>
      <button class="copy-btn" id="copyBtn" onclick="copySummary()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copy text
      </button>
    </div>

    <div class="reset-notice" id="resetNotice"></div>
  </div>

</div>

<script>
  // ── Helpers ──────────────────────────────────────────────
  const toMin = t => {
    if (!t) return 0;
    const [h, m] = t.split(':').map(Number);
    return h * 60 + m;
  };

  const fmtTime = t => {
    if (!t) return '–';
    let [h, m] = t.split(':').map(Number);
    const ampm = h >= 12 ? 'pm' : 'am';
    h = h % 12 || 12;
    return `${h}:${String(m).padStart(2,'0')} ${ampm}`;
  };

  const fmtDate = dateStr => {
    const d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' });
  };

  const fmtHrMin = totalMins => {
    const h = Math.floor(totalMins / 60);
    const m = Math.round(totalMins % 60);
    if (h === 0) return `${m} min`;
    if (m === 0) return `${h} hr`;
    return `${h} hr ${m} min`;
  };

  function setNow(id) {
    const now = new Date();
    document.getElementById(id).value = now.toTimeString().slice(0,5);
  }

  // ── Monday of current week ────────────────────────────────
  function getWeekMonday(from = new Date()) {
    const d = new Date(from);
    d.setHours(0,0,0,0);
    const day = d.getDay(); // 0=Sun
    const diff = day === 0 ? -6 : 1 - day;
    d.setDate(d.getDate() + diff);
    return d;
  }

  function getWeekKey() {
    const mon = getWeekMonday();
    return mon.toISOString().slice(0,10);
  }

  // ── Storage with weekly auto-reset ───────────────────────
  function loadStore() {
    try {
      const raw = localStorage.getItem('workLogs_v2');
      if (!raw) return { weekKey: getWeekKey(), days: {} };
      const store = JSON.parse(raw);
      // auto-reset on new week
      if (store.weekKey !== getWeekKey()) {
        return { weekKey: getWeekKey(), days: {} };
      }
      return store;
    } catch { return { weekKey: getWeekKey(), days: {} }; }
  }

  function saveStore(store) {
    localStorage.setItem('workLogs_v2', JSON.stringify(store));
  }

  // ── Breaks ───────────────────────────────────────────────
  function addBreak(s = '', e = '') {
    const row = document.createElement('div');
    row.className = 'break-row';
    row.innerHTML = `
      <input type="time" class="bStart" value="${s}">
      <input type="time" class="bEnd" value="${e}">
      <button class="remove-btn" onclick="this.parentElement.remove()">✕</button>
    `;
    document.getElementById('breakContainer').appendChild(row);
  }

  // ── Calc net hours ────────────────────────────────────────
  function calcMins(day) {
    let total = toMin(day.end) - toMin(day.start);
    if (total < 0) total += 1440;
    (day.breaks || []).forEach(b => {
      const diff = toMin(b.end) - toMin(b.start);
      if (diff > 0) total -= diff;
    });
    return Math.max(0, total);
  }

  // ── Save ─────────────────────────────────────────────────
  function saveData() {
    const key = document.getElementById('datePicker').value;
    if (!key) { alert('Select a date'); return; }

    const start = document.getElementById('startTime').value;
    const end = document.getElementById('endTime').value;

    if (!start || !end) { alert('Enter start and end time'); return; }
    if (toMin(end) <= toMin(start)) { alert('End time must be after start time'); return; }

    const breaks = [];
    document.querySelectorAll('.break-row').forEach(b => {
      const s = b.querySelector('.bStart').value;
      const e = b.querySelector('.bEnd').value;
      if (s && e) breaks.push({ start: s, end: e });
    });

    const store = loadStore();
    store.days[key] = { start, end, breaks };
    saveStore(store);
    loadWeekly();
  }

  // ── Load day into form ────────────────────────────────────
  function loadDayData() {
    const key = document.getElementById('datePicker').value;
    const store = loadStore();
    const day = store.days[key];

    document.getElementById('startTime').value = day?.start || '';
    document.getElementById('endTime').value = day?.end || '';
    document.getElementById('breakContainer').innerHTML = '';
    (day?.breaks || []).forEach(b => addBreak(b.start, b.end));
  }

  // ── Delete ────────────────────────────────────────────────
  function deleteDay() {
    const key = document.getElementById('datePicker').value;
    if (!confirm('Delete this entry?')) return;
    const store = loadStore();
    delete store.days[key];
    saveStore(store);
    loadDayData();
    loadWeekly();
  }

  // ── Weekly display + summary ──────────────────────────────
  function loadWeekly() {
    const store = loadStore();
    const container = document.getElementById('weeklyData');
    container.innerHTML = '';

    const entries = Object.entries(store.days)
      .sort((a, b) => a[0].localeCompare(b[0]));

    if (entries.length === 0) {
      container.innerHTML = '<div class="empty-note">No entries this week</div>';
      document.getElementById('summaryBox').style.display = 'none';
      return;
    }

    let grandTotalMins = 0;

    entries.forEach(([date, d]) => {
      const mins = calcMins(d);
      grandTotalMins += mins;

      const row = document.createElement('div');
      row.className = 'history-row';
      row.innerHTML = `
        <span class="history-date">${fmtDate(date)}</span>
        <span class="history-hrs">${fmtHrMin(mins)}</span>
      `;
      container.appendChild(row);
    });

    // total row
    const totalRow = document.createElement('div');
    totalRow.className = 'weekly-total';
    totalRow.innerHTML = `
      <span>Grand Total</span>
      <span>${fmtHrMin(grandTotalMins)}</span>
    `;
    container.appendChild(totalRow);

    // week range in title
    const mon = getWeekMonday();
    const sun = new Date(mon); sun.setDate(sun.getDate() + 6);
    document.getElementById('weekRange').textContent =
      `— ${mon.toLocaleDateString('en-IN',{day:'2-digit',month:'short'})} to ${sun.toLocaleDateString('en-IN',{day:'2-digit',month:'short'})}`;

    // Build summary text
    let lines = [];
    entries.forEach(([date, d]) => {
      const mins = calcMins(d);
      const breakParts = (d.breaks || []).map(b => `${fmtTime(b.start)} – ${fmtTime(b.end)}`);
      const breakStr = breakParts.length ? breakParts.join(', ') : 'NIL';

      lines.push(
        `${fmtDate(date)} :-`,
        `Working hours :- ${fmtTime(d.start)} to ${fmtTime(d.end)}`,
        `Break :- ${breakStr}`,
        `Total hours :- ${fmtHrMin(mins)}`,
        ``
      );
    });

    lines.push(`Grand Total hours :- ${fmtHrMin(grandTotalMins)}`);

    document.getElementById('summaryText').textContent = lines.join('\n');
    document.getElementById('summaryBox').style.display = 'block';

    // Next reset notice
    const nextMon = new Date(mon); nextMon.setDate(nextMon.getDate() + 7);
    document.getElementById('resetNotice').textContent =
      `Auto-resets on ${nextMon.toLocaleDateString('en-IN',{weekday:'short',day:'2-digit',month:'short'})}`;
  }

  // ── Copy summary ──────────────────────────────────────────
  function copySummary() {
    const text = document.getElementById('summaryText').textContent;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById('copyBtn');
      btn.classList.add('copied');
      btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> Copied!`;
      setTimeout(() => {
        btn.classList.remove('copied');
        btn.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2-2v1"/></svg> Copy text`;
      }, 2200);
    }).catch(() => {
      // fallback
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    });
  }

  // ── Init ──────────────────────────────────────────────────
  window.onload = () => {
    const today = new Date().toISOString().slice(0,10);
    document.getElementById('datePicker').value = today;
    document.getElementById('todayDate').textContent =
      new Date().toLocaleDateString('en-IN',{weekday:'long', day:'numeric', month:'long', year:'numeric'});

    document.getElementById('datePicker').addEventListener('change', loadDayData);

    loadDayData();
    loadWeekly();
  };
</script>
</body>
</html>
